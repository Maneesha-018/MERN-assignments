<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf0f6;
            margin: 0;
            padding: 40px;
        }

        .card {
            width: 300px;
            background-color: white;
            padding: 25px;
            margin: 50px auto;
            border: 2px solid #2563eb;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px #cccccc;
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2563eb;
        }

        .card h1 {
            color: #2563eb;
            font-size: 25px;
        }

        .card p {
            color: #555555;
            line-height: 1.6;
        }

        .card button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="Screenshot_2026-10-28_232607-removebg-preview.png" alt="My Profile Photo">

        <h1>Manisha Kumari</h1>

        <p>Software Developer</p>

        <p>
            I am a BCA student interested in
            web development and programming.
        </p>

        <p><b>Skills:</b> HTML, CSS, JavaScript, Python</p>

        <button>View Profile</button>

    </div>

</body>
</html>
