<!DOCTYPE html>
<html>
<head>
    <title>Product Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-grid">

        <div class="product">
            <img src="https://picsum.photos/200?random=1" alt="Shoes">
            <h3>Shoes</h3>
            <p>Price: ₹800</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/200?random=2" alt="Watch">
            <h3>Watch</h3>
            <p>Price: ₹1200</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/200?random=3" alt="Bag">
            <h3>Bag</h3>
            <p>Price: ₹600</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/200?random=4" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹500</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
