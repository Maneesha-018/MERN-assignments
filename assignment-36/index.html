
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Selection Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 id="heading">Element Selection Challenge</h1>

        <p class="info">First Paragraph</p>
        <p class="info">Second Paragraph</p>
        <p class="info">Third Paragraph</p>

        <button onclick="selectById()">Select by ID</button>
        <button onclick="selectByClass()">Select by Class</button>
        <button onclick="selectByTag()">Select by Tag</button>
        <button onclick="selectQuery()">Select by Query</button>
        <button onclick="selectAll()">Select All</button>

        <div id="result">Click any button to see the result.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
