<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Profile</h1>

        <div class="profile">
            <h2 id="name"></h2>
            <p id="age"></p>
            <p id="course"></p>
            <p id="marks"></p>
            <p id="status"></p>
            <h3>Subjects:</h3>
            <ul id="subjects"></ul>
        </div>

        <button onclick="showProfile()">Show Profile</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
