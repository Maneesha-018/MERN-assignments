
<!DOCTYPE html>
<html>
<head>
    <title>Settings and Total Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Utility Calculator</h1>

        <h3>Merge Settings</h3>
        <button onclick="showSettings()">Merge Settings</button>

        <div id="settings"></div>

        <h3>Calculate Total</h3>

        <input type="number" id="price" placeholder="Enter Price">
        <input type="number" id="quantity" placeholder="Enter Quantity">

        <button onclick="showTotal()">Calculate Total</button>

        <div id="total"></div>
    </div>

  
    <script src="script.js"></script>
</body>
</html>
