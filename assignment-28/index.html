<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Strings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Arrays and Strings</h1>

        <h3>1. Find Largest Number</h3>
        <input type="text" id="numbers" placeholder="Enter numbers: 10, 20, 5">
        <button onclick="findLargest()">Find Largest</button>

        <h3>2. Reverse Array</h3>
        <button onclick="reverseArray()">Reverse Array</button>

        <h3>3. Reverse String</h3>
        <input type="text" id="textInput" placeholder="Enter a string">
        <button onclick="reverseString()">Reverse String</button>

        <h3>4. Check Palindrome</h3>
        <button onclick="checkPalindrome()">Check Palindrome</button>

        <div id="result">Result will appear here.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
